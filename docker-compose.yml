version: '3.8'

services:
  sentinel-dns:
    build: .
    container_name: sentinel-dns
    restart: unless-stopped
    ports:
      - "5300:5300/udp"
      - "8000:8000/tcp"
    environment:
      - SENTINEL_DNS_HOST=0.0.0.0
      - SENTINEL_DNS_PORT=5300
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
    volumes:
      - ./data:/app/data
